name: Deploy 60 pages
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          ZIP=$(find. -name "*.zip" -type f | head -1)
          echo "Zip: $ZIP"
          unzip -o "$ZIP" -d /tmp/p
          SRC=$(find /tmp/p -type d -name services | head -1)
          echo "Services: $SRC"
          mkdir -p public/services
          cp -r $SRC/* public/services/
          rm -rf /tmp/p "$ZIP"
          ls public/services | wc -l
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add public/services/
          git commit -m "Add 60 pages" || true
          git push
