name: Deploy 60 pages
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ls *.zip 1> /dev/null 2>&1; then
            ZIP=$(ls *.zip | head -1)
            unzip -o $ZIP -d /tmp/p
            SRC=$(find /tmp/p -type d -name services | head -1)
            mkdir -p public/services
            cp -r $SRC/* public/services/
            rm -rf /tmp/p $ZIP
            ls public/services | wc -l
          fi
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add public/services/
          git commit -m "Fix root services" || true
          git push
